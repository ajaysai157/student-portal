<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Student</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #5f9cff, #8f6ed5);
            min-height: 100vh;
        }

        /* NAVBAR */

        .navbar {
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #5f9cff;
        }

        .navbar a {
            text-decoration: none;
            background: #5f9cff;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            transition: 0.3s;
        }

        .navbar a:hover {
            background: #3e7af5;
            transform: translateY(-2px);
        }

        /* PAGE CENTERING */

        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }

        /* FORM CARD */

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 18px;
            width: 650px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            transition: 0.3s;
        }

        .container:hover {
            transform: translateY(-3px);
        }

        /* TITLE */

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            font-size: 26px;
        }

        /* GRID FORM */

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        /* FULL WIDTH */

        .full {
            grid-column: 1 / 3;
        }

        /* LABELS */

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 5px;
            color: #444;
        }

        /* INPUTS */

        input,
        select {
            width: 100%;
            padding: 11px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
            transition: 0.2s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #5f9cff;
            box-shadow: 0 0 6px rgba(95, 156, 255, 0.4);
        }

        /* IMAGE PREVIEW */

        .preview {
            text-align: center;
            margin-top: 10px;
        }

        .preview img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #5f9cff;
            display: none;
            margin-top: 10px;
        }

        /* BUTTON */

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #5f9cff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #3e7af5;
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        /* BOTTOM LINK */

        .bottom-link {
            text-align: center;
            margin-top: 20px;
        }

        .bottom-link a {
            text-decoration: none;
            color: #5f9cff;
            font-weight: 600;
            font-size: 14px;
        }

        .bottom-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="logo">Student Portal</div>
        <a href="{% url 'students_list' %}">View Students</a>
    </div>

    <div class="wrapper">

        <div class="container">

            <h2>Register Student</h2>

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                <div class="form-grid">

                    <div>
                        <label>Student Name</label>
                        <input type="text" name="student_name" placeholder="Enter student name" required>
                    </div>

                    <div>
                        <label>Student ID</label>
                        <input type="text" name="student_id" placeholder="Enter student ID" required>
                    </div>

                    <div>
                        <label>Branch</label>
                        <input type="text" name="student_branch" placeholder="Enter branch" required>
                    </div>

                    <div>
                        <label>Section</label>
                        <select name="student_section" required>
                            <option value="">Select Section</option>
                            <option value="1">Section 1</option>
                            <option value="2">Section 2</option>
                            <option value="3">Section 3</option>
                        </select>
                    </div>

                    <div class="full">
                        <label>Student Image</label>
                        <input type="file" name="student_image" accept="image/*" onchange="previewImage(event)">
                    </div>

                </div>

                <div class="preview">
                    <img id="imagePreview">
                </div>

                <button type="submit">Register Student</button>

            </form>

            <div class="bottom-link">
                <a href="{% url 'students_list' %}">← Back to Students List</a>
            </div>

        </div>

    </div>

    <script>

        function previewImage(event) {

            let reader = new FileReader();

            reader.onload = function () {
                let output = document.getElementById("imagePreview");
                output.src = reader.result;
                output.style.display = "block";
            }

            reader.readAsDataURL(event.target.files[0]);

        }

    </script>

</body>

</html>
