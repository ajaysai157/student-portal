{% comment %}Search and filter form shared by the admin and the faculty directory.{% endcomment %}
<form class="filter-bar" method="GET" action="{% url 'student_directory' %}" role="search">
    <div class="filter-search">
        <label for="filter-q">Search</label>
        <input type="search" id="filter-q" name="q" value="{{ current_q }}"
            placeholder="Name or student ID" autocomplete="off">
    </div>

    <div class="filter-field">
        <label for="filter-department">Department</label>
        <select id="filter-department" name="department">
            <option value="">All departments</option>
            {% for department in departments %}
            <option value="{{ department.pk }}" {% if current_department == department.pk|stringformat:"s" %}selected{% endif %}>
                {{ department.code }} &ndash; {{ department.name }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="filter-field">
        <label for="filter-section">Section</label>
        <select id="filter-section" name="section">
            <option value="">All sections</option>
            {% for value, label in sections %}
            <option value="{{ value }}" {% if current_section == value|stringformat:"s" %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="filter-actions">
        <button type="submit" class="btn btn-primary">Apply</button>
        <a class="btn btn-ghost" href="{% url 'student_directory' %}">Reset</a>
    </div>
</form>
