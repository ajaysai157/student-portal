<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Student</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #5f9cff, #8f6ed5);
            min-height: 100vh;
        }
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #5f9cff;
        }

        .navbar a {
            text-decoration: none;
            background: #5f9cff;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            transition: 0.3s;
        }

        .navbar a:hover {
            background: #3e7af5;
        }

        /* CENTERING */

        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }

        /* FORM CARD */

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            padding: 40px;
            border-radius: 18px;
            width: 420px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            transition: 0.3s;
        }

        .container:hover {
            transform: translateY(-3px);
        }

        /* TITLE */

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
            font-size: 24px;
        }

        /* LABELS */

        label {
            font-weight: 600;
            display: block;
            margin-top: 14px;
            color: #444;
        }

        /* INPUTS */

        input,
        select {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
            transition: 0.2s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #5f9cff;
            box-shadow: 0 0 6px rgba(95, 156, 255, 0.4);
        }

        /* IMAGE */

        .preview {
            text-align: center;
            margin-top: 15px;
        }

        .preview img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #5f9cff;
            margin-top: 10px;
        }

        /* BUTTON */

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #5f9cff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #3e7af5;
            transform: scale(1.02);
        }

        /* BACK LINK */

        .bottom-link {
            text-align: center;
            margin-top: 20px;
        }

        .bottom-link a {
            text-decoration: none;
            color: #5f9cff;
            font-weight: 600;
            font-size: 14px;
        }

        .bottom-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="logo">Student Portal</div>
        <a href="{% url 'students_list' %}">View Students</a>
    </div>

    <div class="wrapper">

        <div class="container">

            <h2>Update Student</h2>

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                <label>Student ID</label>
                <input type="text" name="student_id" value="{{ student.student_id }}" readonly>

                <label>Student Name</label>
                <input type="text" name="student_name" value="{{ student.student_name }}" required>

                <label>Student Branch</label>
                <input type="text" name="student_branch" value="{{ student.student_branch }}" required>

                <label>Student Section</label>
                <select name="student_section">

                    <option value="1" {% if student.student_section == 1 %}selected{% endif %}>Section 1</option>
                    <option value="2" {% if student.student_section == 2 %}selected{% endif %}>Section 2</option>
                    <option value="3" {% if student.student_section == 3 %}selected{% endif %}>Section 3</option>

                </select>

                <label>Current Photo</label>

                <div class="preview">

                    {% if student.student_image %}
                    <img id="imagePreview" src="{{ student.student_image.url }}">
                    {% else %}
                    <img id="imagePreview" style="display:none;">
                    <p>No image available</p>
                    {% endif %}

                </div>

                <label>Change Photo</label>
                <input type="file" name="student_image" accept="image/*" onchange="previewImage(event)">

                <button type="submit">Update Student</button>

            </form>

            <div class="bottom-link">
                <a href="{% url 'students_list' %}">← Back to Students List</a>
            </div>

        </div>

    </div>

    <script>

        function previewImage(event) {
            let reader = new FileReader();
            reader.onload = function () {
                let output = document.getElementById("imagePreview");
                output.src = reader.result;
                output.style.display = "block";
            }

            reader.readAsDataURL(event.target.files[0]);
        }

    </script>

</body>

</html>
