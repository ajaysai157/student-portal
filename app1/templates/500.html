<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something went wrong &middot; College Management Portal</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6f9;
            color: #16202c;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .box {
            max-width: 34rem;
            margin: 2rem;
            padding: 2.5rem;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            text-align: center;
        }

        .code {
            font-size: 3rem;
            font-weight: 700;
            color: #b91c1c;
            margin: 0;
        }

        h1 {
            font-size: 1.35rem;
            margin: 0.5rem 0 1rem;
        }

        p {
            color: #52606d;
            line-height: 1.6;
            margin: 0 0 1.5rem;
        }

        a {
            display: inline-block;
            padding: 0.7rem 1.4rem;
            border-radius: 8px;
            background: #1b4965;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <main class="box">
        <p class="code">500</p>
        <h1>Something went wrong</h1>
        <p>
            The portal could not finish your request. The problem has been logged.
            Please try again, and contact the administration if it keeps happening.
        </p>
        <a href="/">Back to the portal</a>
    </main>
</body>

</html>
