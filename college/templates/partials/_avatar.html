{% comment %}
Photo of a student, or the default avatar of the gender when no photo was
uploaded.  The tag lives in ``college/templatetags/college_tags.py``.
{% endcomment %}
{% load college_tags %}
{% student_avatar student as avatar_url %}
{% if student.photo_url %}
<img class="avatar" src="{{ avatar_url }}" alt="Photo of {{ student.student_name }}" loading="lazy">
{% else %}
<img class="avatar" src="{{ avatar_url }}" alt="Default avatar of {{ student.student_name }}" loading="lazy">
{% endif %}
