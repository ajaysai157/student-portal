{% comment %}Search and filter form shared by the admin and the faculty directory.{% endcomment %}
<form class="filter-bar" method="GET" action="{% url 'student_directory' %}" role="search">
    <div class="filter-search">
        <label for="filter-q">Search the directory</label>
        <div class="filter-search-box">
            <svg class="filter-search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M10.5 3a7.5 7.5 0 1 1-4.6 13.4l-3.2 3.2a1 1 0 0 1-1.4-1.4l3.2-3.2A7.5 7.5 0 0 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z" />
            </svg>
            <input type="search" id="filter-q" name="q" value="{{ current_q }}"
                placeholder="Search by student name or ID" autocomplete="off"
                spellcheck="false" aria-label="Search by student name or ID">
            {% if current_q %}
            <a class="filter-search-clear" href="{% url 'student_directory' %}"
                aria-label="Clear the search term">&times;</a>
            {% endif %}
        </div>
    </div>

    <div class="filter-field">
        <label for="filter-department">Department</label>
        <div class="select-wrap">
            <select id="filter-department" name="department">
                <option value="">All departments</option>
                {% for department in departments %}
                <option value="{{ department.pk }}" {% if current_department == department.pk|stringformat:"s" %}selected{% endif %}>
                    {{ department }}
                </option>
                {% endfor %}
            </select>
            <svg class="select-caret" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M7 10l5 5 5-5H7z" />
            </svg>
        </div>
    </div>

    <div class="filter-field">
        <label for="filter-section">Section</label>
        <div class="select-wrap">
            <select id="filter-section" name="section">
                <option value="">All sections</option>
                {% for value, label in sections %}
                <option value="{{ value }}" {% if current_section == value|stringformat:"s" %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
            <svg class="select-caret" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M7 10l5 5 5-5H7z" />
            </svg>
        </div>
    </div>

    <div class="filter-actions">
        <button type="submit" class="btn btn-primary">
            <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M10.5 3a7.5 7.5 0 1 1-4.6 13.4l-3.2 3.2a1 1 0 0 1-1.4-1.4l3.2-3.2A7.5 7.5 0 0 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z" />
            </svg>
            Search
        </button>
        <a class="btn btn-ghost" href="{% url 'student_directory' %}">Reset</a>
    </div>
</form>
